<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三原由雅 ポートフォリオ</title>
<style>
/* 1ページずつめくれるポートフォリオ（A3横）。下にページ送りとPDFリンク */
:root{--desk:#e9e9e6;--ink:#151515;--sub:#77776f;--acc:#1F6FD6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
#wrap{flex:none}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--sub)}
.bar button{border:1px solid #cfcfca;background:#fff;color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px}
.bar input{width:min(260px,38vw);accent-color:var(--ink)}
#count{min-width:4.5em;text-align:center;font-variant-numeric:tabular-nums}
.bar a{color:var(--ink);text-decoration:none;border:1px solid #cfcfca;background:#fff;border-radius:999px;padding:8px 14px}
</style></head><body>
<div class="stage"><div id="wrap"><div id="book"></div></div></div>
<div class="bar">
  <button id="prev" type="button" aria-label="前のページ">←</button>
  <input id="seek" type="range" min="0" value="0" aria-label="ページを選ぶ">
  <span id="count"></span>
  <button id="next" type="button" aria-label="次のページ">→</button>
  <a href="portfolio.pdf" target="_blank" rel="noopener">PDFで見る</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const N=49, R=297/420;
const book=document.getElementById('book'), wrap=document.getElementById('wrap');
for(let i=1;i<=N;i++){const d=document.createElement('div');d.className='page';d.innerHTML=`<img src="p/${String(i).padStart(2,'0')}.jpg" alt="${i}ページ目" ${i>4?'loading="lazy"':''}>`;book.appendChild(d);}
function size(){const st=document.querySelector('.stage');const aw=st.clientWidth-32, ah=st.clientHeight-32;let w=Math.min(aw,ah/R);return [Math.floor(w),Math.floor(w*R)];}
let [w,h]=size(); wrap.style.width=w+'px'; wrap.style.height=h+'px';
const pf=new St.PageFlip(book,{width:w,height:h,size:'fixed',usePortrait:true,showCover:false,maxShadowOpacity:.35,mobileScrollSupport:false,flippingTime:650});
pf.loadFromHTML(document.querySelectorAll('.page'));
const seek=document.getElementById('seek'),count=document.getElementById('count');seek.max=N-1;
function upd(){const i=pf.getCurrentPageIndex();seek.value=i;count.textContent=(i+1)+' / '+N;}
pf.on('flip',upd);upd();
document.getElementById('prev').onclick=()=>pf.flipPrev();
document.getElementById('next').onclick=()=>pf.flipNext();
seek.oninput=()=>{pf.turnToPage(+seek.value);upd();};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev();});
let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>location.reload(),400);});
</script></body></html>
