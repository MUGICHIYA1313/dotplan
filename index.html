<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOTPLAN</title>
<meta name="description" content="タスクと予定をまとめて管理する自分用アプリ">
<meta name="theme-color" content="#EFEFEF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DOTPLAN">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&family=M+PLUS+1:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EFEFEF;--card:#FFFFFF;--ink:#111111;--muted:#666666;--dim:#7A7A7A;
  --line:#C4C4C4;--border:#D6D6D6;--seg:#E3E3E3;--red:#D71921;--redt:#C8161E;
  --dot:'DotGothic16',ui-monospace,monospace;--mono:'Space Mono',ui-monospace,monospace;
  --jp:'M PLUS 1',-apple-system,'Hiragino Sans',sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--jp);-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
#app{position:absolute;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(var(--sb) + 110px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s{width:14px;height:14px}.ic.l{width:26px;height:26px;stroke-width:2}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.dot{font-family:var(--dot);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{padding:calc(var(--st) + 18px) 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigline{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.big{margin:0;font-family:var(--dot);font-weight:400;font-size:64px;line-height:.9}
.big small{font-size:20px;color:#8A8A8A;margin-left:4px}
.wd{font-size:16px;font-weight:500}
.reddot{width:8px;height:8px;border-radius:4px;background:var(--red);align-self:flex-start;margin-top:6px}
.hbtns{display:flex;gap:6px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.pill{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--ink);background:var(--card);font-size:14px;font-weight:700}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 14px 14px;touch-action:pan-y}
.wk{height:64px;border:1px solid #E0E0E0;border-radius:32px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.wk .s{font-size:11px;opacity:.8}.wk .d{font-family:var(--dot);font-size:18px}
.wk .p{width:4px;height:4px;border-radius:2px}
.wk.has .p{background:#9A9A9A}
.wk.today:not(.sel) .d{color:var(--redt)}
.wk.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.wk.sel.has .p{background:var(--red)}

/* cards */
.card{display:block;width:100%;background:var(--card);border:none;border-radius:26px;padding:8px 18px;margin:0 0 10px;text-align:left}
.card-h{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:8px}
.link{border:none;background:none;padding:10px 0;font-size:12px;display:flex;align-items:center;gap:4px}
.count{font-family:var(--dot);font-size:20px}.count span{color:#8A8A8A}
.empty{padding:14px 0 16px;border-top:1px dotted var(--line);font-size:13px;color:var(--muted)}

/* now */
.now{padding:18px}
.now .top2{display:flex;justify-content:space-between;align-items:center}
.live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--redt)}
.live i{width:6px;height:6px;border-radius:3px;background:var(--redt);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.now .mid{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 0}
.now .ttl{font-size:22px;font-weight:700;display:block}
.now .sub{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.now .rng{font-family:var(--dot);font-size:26px;line-height:1;white-space:nowrap}
.now .rng span{color:#8A8A8A}
.segs{display:grid;gap:3px}
.segs i{height:6px;border-radius:3px;background:var(--seg)}
.segs i.on{background:var(--ink)}.segs i.cur{background:var(--red)}
.bar{height:6px;border-radius:3px;background:var(--seg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}

/* rows */
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border:none;border-top:1px dotted var(--line);background:none;text-align:left;min-height:52px}
.row .tm{width:52px;flex-shrink:0;font-family:var(--dot);font-size:18px}
.row .tm.txt{font-family:var(--jp);font-size:13px;font-weight:500}
.row .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .rt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.row .rs{font-size:12px;color:var(--muted)}
.row.past{color:var(--dim)}.row.past .rt{text-decoration:line-through}
.trow{display:flex;align-items:center;gap:6px;border-top:1px dotted var(--line);margin-left:-8px}
.chk{width:44px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk span{width:22px;height:22px;border-radius:11px;border:1.5px solid #B0B0B0;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,border-color .15s}
.chk svg{opacity:0;width:14px;height:14px;stroke-width:3}
.trow.done .chk span{background:var(--ink);border-color:var(--ink)}
.trow.done .chk svg{opacity:1}
.tb{flex:1;min-width:0;border:none;background:none;padding:10px 0;text-align:left;display:flex;flex-direction:column;gap:4px}
.tb .tt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.trow.done .tt{color:var(--dim);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta .sl{color:var(--line)}.meta .urg{color:var(--redt);font-weight:500}
.hi{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;letter-spacing:.08em}

/* markers */
.mk{display:inline-block;width:7px;height:7px;flex-shrink:0;color:var(--mkc,var(--ink))}
.mk-dot{background:currentColor;border-radius:4px}
.mk-ring{border:1.5px solid currentColor;border-radius:4px}
.mk-square{background:currentColor;border-radius:1px}
.legend{display:flex;gap:16px;padding:0 20px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

/* calendar */
.cal{background:var(--card);border-radius:26px;margin:0 14px;padding:12px 8px 10px;touch-action:pan-y}
.cal .dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);padding-bottom:6px}
.cal .dows span:first-child{color:var(--redt)}
.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cc{height:48px;border:none;border-radius:24px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;color:var(--ink)}
.cc .n{font-family:var(--dot);font-size:16px}
.cc .mks{display:flex;gap:3px;height:5px}.cc .mk{width:5px;height:5px}
.cc.out{color:#8A8A8A}
.cc.today .n{color:var(--redt)}.cc.today{box-shadow:inset 0 0 0 1px var(--redt)}
.cc.sel{background:var(--ink);color:#fff;box-shadow:none;--mkc:#fff}.cc.sel .n{color:#fff}
.agh{display:flex;justify-content:space-between;align-items:baseline;padding:18px 6px 10px}
.agh h2{margin:0;font-size:16px;font-weight:700}
.dash{border:1px dashed #BDBDBD;border-radius:26px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}

/* tasks view */
.segc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:26px;background:#E3E3E3;margin:0 14px 12px}
.segc.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.segc button{height:40px;border:none;border-radius:22px;background:none;font-size:14px;font-weight:700;color:var(--muted)}
.segc button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.12)}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.grp.red{color:var(--redt)}
.textbtn{width:100%;min-height:52px;border:none;border-top:1px dotted var(--line);background:none;text-align:left;font-size:15px;font-weight:500;padding:0;display:flex;align-items:center;gap:12px}
.textbtn.red{color:var(--redt)}

/* settings */
.field{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px dotted var(--line)}
.field:first-of-type{border-top:none}
.field input[type=text]{flex:1;min-width:0;border:none;background:none;font-size:16px;padding:10px 0;outline:none}
.note{font-size:13px;line-height:1.7;color:var(--muted);padding:4px 0 12px;margin:0}
.note b{color:var(--ink);font-weight:500}

/* fab + tabbar */
.fab{position:absolute;right:20px;bottom:calc(var(--sb) + 84px);width:60px;height:60px;border-radius:30px;border:none;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(17,17,17,.18);z-index:5}
.fab[hidden]{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;padding:6px 12px calc(var(--sb) + 6px);background:var(--card);border-top:1px solid #E0E0E0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;z-index:6}
.tab{height:56px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);padding:0}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab .lb{display:flex;align-items:center;gap:4px}
.tab[aria-current="page"] .lb::after{content:"";width:4px;height:4px;border-radius:2px;background:var(--red)}

/* sheet */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-head{padding:calc(var(--st) + 12px) 16px 8px;display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center}
.sh-head h2{margin:0;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em}
.save{justify-self:end;height:44px;padding:0 20px;border-radius:22px;border:none;background:var(--red);color:#fff;font-size:15px;font-weight:700}
.sh-body{padding-top:14px;padding-bottom:calc(var(--sb) + 40px)}
.fcard{background:var(--card);border-radius:26px;padding:16px 18px 18px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px}
.fcard.rows{padding:6px 18px;gap:0}
.tinput{height:48px;border:none;border-bottom:1px dotted #9A9A9A;background:none;padding:0;font-size:20px;font-weight:500;outline:none;width:100%}
.tinput.err{border-bottom-color:var(--redt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;--mkc:#fff}
.frow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px dotted var(--line)}
.frow:first-child{border-top:none}
.frow .lab{flex:1;font-size:15px;white-space:nowrap}
.frow .ic{color:var(--muted)}
.frow input[type=date],.frow input[type=time]{border:none;background:#F2F2F2;border-radius:12px;height:40px;padding:0 12px;font-family:var(--dot);font-size:17px;color:var(--ink);-webkit-appearance:none;appearance:none;min-width:0}
.frow input[type=text]{flex:1;min-width:0;border:none;background:none;font-size:16px;text-align:right;outline:none;padding:10px 0}
.mini{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500}
.sw{width:52px;height:32px;border-radius:16px;border:1px solid #B0B0B0;padding:3px;background:var(--card);display:flex;flex-shrink:0}
.sw span{width:24px;height:24px;border-radius:12px;background:#B0B0B0;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--red);border-color:var(--red)}
.sw[aria-checked="true"] span{background:#fff;transform:translateX(20px)}
.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.prio button{height:48px;border-radius:24px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.prio .bars{display:flex;gap:2px;align-items:flex-end}
.prio .bars i{width:3px;border-radius:1px;background:#D6D6D6}
.prio .bars i.on{background:currentColor}
.prio button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.prio button.h[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.prio button[aria-pressed="true"] .bars i:not(.on){background:rgba(255,255,255,.35)}
textarea{width:100%;border:none;background:none;font-size:16px;line-height:1.6;resize:none;outline:none;padding:0}
.del{width:100%;height:52px;border-radius:26px;border:1px solid var(--redt);background:var(--card);color:var(--redt);font-size:15px;font-weight:700;margin-top:6px}
.del + .del{margin-top:10px}
.hist{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hchip{flex-shrink:0;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;max-width:240px}
.hchip span:not(.mk):not(.dot){overflow:hidden;text-overflow:ellipsis}
.hchip .dot{font-size:14px;color:var(--muted)}
.hchip:active{background:var(--ink);color:#fff;--mkc:#fff}
.repbox{display:flex;flex-direction:column;gap:12px;padding:6px 0 16px;border-top:1px dotted var(--line)}
.wd7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding-top:8px}
.wd7 button{height:44px;border-radius:22px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:700;padding:0}
.wd7 button.sun{color:var(--redt)}
.wd7 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.segc.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.segc.four button{font-size:12px;height:36px}
.qm{padding:14px 18px 10px}
.qm textarea{font-size:16px;min-height:52px}
.qm-f{display:flex;justify-content:space-between;align-items:center;border-top:1px dotted var(--line);padding-top:8px;margin-top:6px}
.mini.dark{background:var(--ink);border-color:var(--ink);color:#fff;height:40px;padding:0 18px;font-weight:700}
.memo{padding:16px 18px 12px;display:flex;flex-direction:column;gap:10px}
.mtx{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mft{display:flex;justify-content:space-between;align-items:center}
.pinned{display:flex;align-items:center;gap:4px;color:var(--redt)}.pinned .mono{color:var(--redt)}
.pinned .ic{width:14px;height:14px}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 160px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:24px;padding:0 8px 0 18px;min-height:48px;display:flex;align-items:center;gap:8px;font-size:14px;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 40px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:none;background:none;color:#FF7A7A;font-weight:700;height:40px;padding:0 10px}
.toast:not(.has-act){padding-right:18px}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <button class="fab" data-action="add" aria-label="追加"><svg class="ic l" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" aria-label="メイン">
    <button class="tab" data-action="tab" data-view="today"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span class="lb">今日</span></button>
    <button class="tab" data-action="tab" data-view="calendar"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="lb">カレンダー</span></button>
    <button class="tab" data-action="tab" data-view="tasks"><svg class="ic" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="lb">タスク</span></button>
    <button class="tab" data-action="tab" data-view="memo"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4M9 12h6M9 16h4"/></svg><span class="lb">メモ</span></button>
  </nav>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="編集"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

/* ---------- constants & utils ---------- */
const KEY = 'dotplan:v1';
const DOW_JP = ['日','月','火','水','木','金','土'];
const DOW_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const CAT_IDS = ['k','b','p'];
const SHAPE = { k:'dot', b:'ring', p:'square' };
const DEFAULT_CATS = { k:'課題', b:'バイト', p:'個人' };
const PRIO_RANK = { h:0, m:1, l:2 };

const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMin = (t) => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60 + m; };
const minToT = (m) => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const jpDate = (s) => { const d = parse(s); return `${d.getMonth()+1}月${d.getDate()}日（${DOW_JP[d.getDay()]}）`; };
const shortDate = (s) => { const d = parse(s); return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = (s) => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);

const IC = {
  check: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left: '<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',

  inn: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>',

};
const mk = (c) => `<span class="mk mk-${SHAPE[c] || 'dot'}" aria-hidden="true"></span>`;

/* ---------- storage (sync-ready: ids, updatedAt, soft delete) ---------- */
function freshDb() { return { version: 1, cats: { ...DEFAULT_CATS }, items: [] }; }
function cleanItem(x) {
  if (!x || typeof x !== 'object') return null;
  const kind = ['event', 'memo'].includes(x.kind) ? x.kind : 'task';
  const note = String(x.note ?? '').slice(0, 5000);
  let title = String(x.title ?? '').slice(0, 200).trim();
  if (kind === 'memo') {
    if (!note.trim()) return null;
    title = note.trim().split('\n')[0].slice(0, 200);
  }
  if (!title) return null;
  return {
    id: typeof x.id === 'string' && x.id ? x.id : uid(),
    kind, title,
    cat: CAT_IDS.includes(x.cat) ? x.cat : 'k',
    date: isDate(x.date) ? x.date : null,
    time: isTime(x.time) ? x.time : null,
    end: isTime(x.end) ? x.end : null,
    allDay: !!x.allDay,
    place: String(x.place ?? '').slice(0, 200),
    prio: ['h','m','l'].includes(x.prio) ? x.prio : 'm',
    note,
    series: typeof x.series === 'string' && x.series ? x.series.slice(0, 64) : null,
    pinned: !!x.pinned,
    done: !!x.done,
    createdAt: Number(x.createdAt) || Date.now(),
    updatedAt: Number(x.updatedAt) || Date.now(),
    deleted: !!x.deleted
  };
}
function normalize(d) {
  const out = freshDb();
  if (d && typeof d === 'object') {
    if (d.cats && typeof d.cats === 'object') CAT_IDS.forEach((k) => { if (typeof d.cats[k] === 'string' && d.cats[k].trim()) out.cats[k] = d.cats[k].trim().slice(0, 20); });
    if (Array.isArray(d.items)) out.items = d.items.map(cleanItem).filter(Boolean);
  }
  return out;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return freshDb();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('保存できませんでした（空き容量を確認してください）'); }
}
let db = load();
const live = () => db.items.filter((i) => !i.deleted);
const catName = (c) => db.cats[c] || DEFAULT_CATS[c] || '';

/* ---------- state ---------- */
const t0 = new Date();
const st = {
  view: 'today',
  sel: todayStr(),
  calY: t0.getFullYear(), calM: t0.getMonth(), calSel: todayStr(),
  taskTab: 'open',
  qmemo: '',
  sheet: null
};

/* ---------- queries ---------- */
const eventSort = (a, b) => (b.allDay - a.allDay) || ((toMin(a.time) ?? 0) - (toMin(b.time) ?? 0)) || (a.createdAt - b.createdAt);
const taskSort = (a, b) => (a.done - b.done)
  || ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0)
  || ((toMin(a.time) ?? 1e4) - (toMin(b.time) ?? 1e4))
  || (PRIO_RANK[a.prio] - PRIO_RANK[b.prio])
  || (a.createdAt - b.createdAt);
const eventsOn = (d) => live().filter((i) => i.kind === 'event' && i.date === d).sort(eventSort);
const eventEnd = (e) => toMin(e.end) ?? ((toMin(e.time) ?? 0) + 60);

function dueInfo(i) {
  const t = todayStr();
  if (!i.date) return { text: '期限なし', urgent: false };
  if (!i.done && i.date < t) return { text: '期限切れ ' + shortDate(i.date), urgent: true };
  let text = i.date === t ? '今日' : i.date === addDays(t, 1) ? '明日' : `${shortDate(i.date)} ${DOW_JP[parse(i.date).getDay()]}`;
  if (i.time) text += ' ' + i.time;
  let urgent = false;
  if (!i.done && i.date === t) urgent = i.prio === 'h' || (i.time ? toMin(i.time) - nowMin() <= 180 : false);
  return { text, urgent };
}

/* ---------- row builders ---------- */
function taskRow(i) {
  const due = dueInfo(i);
  return `<div class="trow${i.done ? ' done' : ''}">
    <button class="chk" data-action="toggle" data-id="${i.id}" aria-label="${i.done ? '未完了に戻す' : '完了にする'}：${esc(i.title)}"><span>${IC.check}</span></button>
    <button class="tb" data-action="edit" data-id="${i.id}">
      <span class="tt">${esc(i.title)}</span>
      <span class="meta">${mk(i.cat)}<span>${esc(catName(i.cat))}</span><span class="sl">/</span><span class="${due.urgent ? 'urg' : ''}">${due.text}</span>${i.prio === 'h' && !i.done ? '<span class="hi">HIGH</span>' : ''}</span>
    </button>
  </div>`;
}
function eventRow(e, dimPast) {
  const past = dimPast && !e.allDay && eventEnd(e) <= nowMin();
  const tm = e.allDay ? '<span class="tm txt">終日</span>' : `<span class="tm">${e.time || ''}</span>`;
  const sub = [e.allDay ? '' : (e.end ? `〜${e.end}` : ''), e.place ? esc(e.place) : ''].filter(Boolean).join('　');
  return `<button class="row${past ? ' past' : ''}" data-action="edit" data-id="${e.id}">${tm}
    <span class="rb"><span class="rt">${esc(e.title)}</span>${sub ? `<span class="rs">${sub}</span>` : ''}</span>
    ${past ? '<span class="mono">DONE</span>' : mk(e.cat)}</button>`;
}
function segBar(done, total) {
  if (!total) return '';
  if (total > 12) return `<div class="bar" style="margin-bottom:10px"><i style="width:${Math.round(done / total * 100)}%"></i></div>`;
  let s = '';
  for (let k = 0; k < total; k++) s += `<i class="${k < done ? 'on' : ''}"></i>`;
  return `<div class="segs" style="grid-template-columns:repeat(${total},minmax(0,1fr));margin-bottom:10px">${s}</div>`;
}

/* ---------- views ---------- */
function vToday() {
  const t = todayStr(), s = st.sel, d = parse(s), isT = s === t, nm = nowMin();
  const head = `<header class="top"><div>
      <div class="mono">${DOW_EN[d.getDay()]} — ${d.getFullYear()}.${pad(d.getMonth()+1)}</div>
      <div class="bigline"><h1 class="big">${pad(d.getDate())}</h1><span class="wd">${DOW_JP[d.getDay()]}曜日</span>${isT ? '<span class="reddot" title="今日"></span>' : ''}</div>
    </div><div class="hbtns">${isT ? '' : '<button class="pill" data-action="goToday">今日へ</button>'}<button class="iconbtn" data-action="tab" data-view="settings" aria-label="設定">${IC.gear}</button></div></header>`;

  const ws = addDays(s, -d.getDay());
  const dates = new Set(live().map((i) => i.date));
  let wk = '';
  for (let k = 0; k < 7; k++) {
    const ds = addDays(ws, k);
    wk += `<button class="wk${ds === s ? ' sel' : ''}${ds === t ? ' today' : ''}${dates.has(ds) ? ' has' : ''}" data-action="selDay" data-date="${ds}" aria-label="${jpDate(ds)}"${ds === s ? ' aria-current="date"' : ''}>
      <span class="s">${DOW_JP[k]}</span><span class="d">${parse(ds).getDate()}</span><span class="p"></span></button>`;
  }

  const evs = eventsOn(s);
  let now = '';
  if (isT) {
    const timed = evs.filter((e) => !e.allDay && e.time);
    const cur = timed.find((e) => toMin(e.time) <= nm && nm < eventEnd(e));
    if (cur) {
      const a = toMin(cur.time), b = eventEnd(cur);
      const f = Math.min(23, Math.floor((nm - a) / (b - a) * 24));
      let sg = ''; for (let k = 0; k < 24; k++) sg += `<i class="${k < f ? 'on' : k === f ? 'cur' : ''}"></i>`;
      now = `<button class="card now" data-action="edit" data-id="${cur.id}">
        <span class="top2"><span class="mono">NOW</span><span class="live"><i></i>進行中</span></span>
        <span class="mid"><span><span class="ttl">${esc(cur.title)}</span>${cur.place ? `<span class="sub">${esc(cur.place)}</span>` : ''}</span>
        <span class="rng">${cur.time}<span>–${minToT(Math.min(b, 1439))}</span></span></span>
        <span class="segs" style="grid-template-columns:repeat(24,minmax(0,1fr))">${sg}</span></button>`;
    } else {
      const nx = timed.find((e) => toMin(e.time) > nm);
      if (nx) {
        const diff = toMin(nx.time) - nm;
        const rel = diff < 60 ? `あと${diff}分` : `あと${Math.floor(diff / 60)}時間${diff % 60 ? (diff % 60) + '分' : ''}`;
        now = `<button class="card now" data-action="edit" data-id="${nx.id}">
          <span class="top2"><span class="mono">NEXT</span><span class="live" style="color:var(--muted)">${rel}</span></span>
          <span class="mid" style="margin-bottom:0"><span><span class="ttl">${esc(nx.title)}</span>${nx.place ? `<span class="sub">${esc(nx.place)}</span>` : ''}</span>
          <span class="rng">${nx.time}${nx.end ? `<span>–${nx.end}</span>` : ''}</span></span></button>`;
      }
    }
  }

  const sched = `<section class="card" aria-label="予定">
    <div class="card-h"><span class="mono">SCHEDULE</span><button class="link" data-action="toCal">カレンダー${IC.rightS}</button></div>
    ${evs.length ? evs.map((e) => eventRow(e, isT)).join('') : '<div class="empty">予定はありません</div>'}
  </section>`;

  const tl = live().filter((i) => i.kind === 'task' && (i.date === s || (isT && i.date && i.date < t && !i.done))).sort(taskSort);
  const dn = tl.filter((i) => i.done).length;
  const tasks = `<section class="card" aria-label="タスク" style="padding-bottom:6px">
    <div class="card-h"><span class="mono">TASKS</span>${tl.length ? `<span class="count">${dn}<span>/${tl.length}</span></span>` : ''}</div>
    ${segBar(dn, tl.length)}
    ${tl.length ? tl.map(taskRow).join('') : '<div class="empty">この日のタスクはありません</div>'}
  </section>`;

  return `${head}<nav class="week" data-swipe="week" aria-label="週">${wk}</nav><main class="scroll">${now}${sched}${tasks}</main>`;
}

function vCal() {
  const t = todayStr(), y = st.calY, m = st.calM;
  const first = new Date(y, m, 1), sd = first.getDay(), dim = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((sd + dim) / 7);
  const start = ymd(new Date(y, m, 1 - sd));
  const by = {};
  live().forEach((i) => { if (i.date) (by[i.date] = by[i.date] || []).push(i); });
  const isCur = y === t0now().getFullYear() && m === t0now().getMonth();
  let cells = '';
  for (let k = 0; k < rows * 7; k++) {
    const ds = addDays(start, k), dd = parse(ds), its = by[ds] || [];
    const cats = []; its.forEach((i) => { if (!cats.includes(i.cat)) cats.push(i.cat); });
    cats.sort((a, b) => CAT_IDS.indexOf(a) - CAT_IDS.indexOf(b));
    cells += `<button class="cc${dd.getMonth() !== m ? ' out' : ''}${ds === st.calSel ? ' sel' : ''}${ds === t ? ' today' : ''}" data-action="calSel" data-date="${ds}" aria-label="${jpDate(ds)}${its.length ? ` ${its.length}件` : ''}"${ds === st.calSel ? ' aria-current="date"' : ''}>
      <span class="n">${pad(dd.getDate())}</span><span class="mks">${cats.map(mk).join('')}</span></button>`;
  }
  const head = `<header class="top"><div>
      <div class="mono">${y} — ${MON_EN[m]}</div>
      <div class="bigline"><h1 class="big">${pad(m + 1)}</h1></div></div>
    <div class="hbtns">${isCur ? '' : '<button class="pill" data-action="calToday">今日</button>'}
      <button class="iconbtn" data-action="calPrev" aria-label="前の月">${IC.left}</button>
      <button class="iconbtn" data-action="calNext" aria-label="次の月">${IC.right}</button></div></header>`;
  const legend = `<div class="legend">${CAT_IDS.map((c) => `<span>${mk(c)}${esc(catName(c))}</span>`).join('')}</div>`;
  const cal = `<div class="cal" data-swipe="month"><div class="dows">${DOW_EN.map((x) => `<span>${x}</span>`).join('')}</div><div class="grid">${cells}</div></div>`;

  const s = st.calSel;
  const evs = eventsOn(s);
  const tks = live().filter((i) => i.kind === 'task' && i.date === s).sort(taskSort);
  const n = evs.length + tks.length;
  let agenda = `<div class="agh"><h2>${jpDate(s)}${s === t ? '・今日' : ''}</h2><span class="mono">${n} ITEMS</span></div>`;
  if (!n) {
    agenda += `<div class="dash"><span class="mono">NO ITEMS</span><button class="pill" data-action="addOn" data-date="${s}">この日に追加</button></div>`;
  } else {
    if (evs.length) agenda += `<section class="card"><div class="card-h"><span class="mono">SCHEDULE</span></div>${evs.map((e) => eventRow(e, s === t)).join('')}</section>`;
    if (tks.length) agenda += `<section class="card" style="padding-bottom:6px"><div class="card-h"><span class="mono">TASKS</span></div>${tks.map(taskRow).join('')}</section>`;
  }
  return `${head}${legend}${cal}<main class="scroll">${agenda}</main>`;
}
function t0now() { return new Date(); }

function vTasks() {
  const t = todayStr();
  const all = live().filter((i) => i.kind === 'task');
  const open = all.filter((i) => !i.done).sort(taskSort);
  const done = all.filter((i) => i.done).sort((a, b) => b.updatedAt - a.updatedAt);
  const head = `<header class="top"><div><div class="mono">ALL TASKS</div>
    <div class="bigline"><h1 class="big">${pad(open.length)}<small>OPEN</small></h1></div></div></header>`;
  const seg = `<div class="segc" role="group" aria-label="表示">
    <button data-action="taskTab" data-tab="open" aria-pressed="${st.taskTab === 'open'}">未完了 ${open.length}</button>
    <button data-action="taskTab" data-tab="done" aria-pressed="${st.taskTab === 'done'}">完了 ${done.length}</button></div>`;
  let body = '';
  if (st.taskTab === 'open') {
    const groups = [
      ['期限切れ', 'OVERDUE', open.filter((i) => i.date && i.date < t), true],
      ['今日', 'TODAY', open.filter((i) => i.date === t), false],
      ['明日以降', 'UPCOMING', open.filter((i) => i.date && i.date > t), false],
      ['期限なし', 'SOMEDAY', open.filter((i) => !i.date), false]
    ];
    body = groups.filter((g) => g[2].length).map(([jp, en, list, red]) =>
      `<section class="card" aria-label="${jp}" style="padding-bottom:6px"><div class="card-h"><span class="grp${red ? ' red' : ''}">${en} — ${jp}</span><span class="count">${list.length}</span></div>${list.map(taskRow).join('')}</section>`).join('');
    if (!body) body = `<div class="dash"><span class="mono">ALL CLEAR</span><span style="font-size:14px;color:var(--muted)">未完了のタスクはありません</span><button class="pill" data-action="add">タスクを追加</button></div>`;
  } else {
    body = done.length
      ? `<section class="card" style="padding-bottom:6px"><div class="card-h"><span class="grp">DONE — 完了</span></div>${done.slice(0, 100).map(taskRow).join('')}
         <button class="textbtn red" data-action="clearDone">${IC.trash}完了済みをすべて削除</button></section>`
      : `<div class="dash"><span class="mono">NO DONE TASKS</span></div>`;
  }
  return `${head}${seg}<main class="scroll">${body}</main>`;
}

function vSettings() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const cnt = live().length;
  const install = standalone ? '' : `<section class="card"><div class="card-h"><span class="mono">INSTALL</span></div>
    <p class="note">Safari の <b>共有ボタン</b> →「<b>ホーム画面に追加</b>」で、アプリとして全画面で使えます。</p></section>`;
  return `<header class="top"><div><div class="mono">SETTINGS</div><div class="bigline"><h1 class="big" style="font-size:40px">設定</h1></div></div><button class="iconbtn" data-action="tab" data-view="today" aria-label="閉じる">${IC.close}</button></header>
  <main class="scroll">${install}
    <section class="card"><div class="card-h"><span class="mono">CATEGORY — カテゴリ名</span></div>
      ${CAT_IDS.map((c) => `<label class="field">${mk(c)}<span class="sr">カテゴリ名</span><input type="text" data-cat="${c}" value="${esc(catName(c))}" maxlength="20" enterkeyhint="done"></label>`).join('')}
    </section>
    <section class="card"><div class="card-h"><span class="mono">DATA — データ</span><span class="count">${cnt}<span> 件</span></span></div>
      <p class="note" style="border-top:1px dotted var(--line);padding-top:12px">データは<b>この端末の中だけ</b>に保存されています。機種変更やもしもの時のために、ときどきバックアップを書き出しておくと安心です。</p>
      <button class="textbtn" data-action="export">${IC.out}バックアップを書き出す</button>
      <button class="textbtn" data-action="import">${IC.inn}バックアップから復元</button>
      <button class="textbtn red" data-action="reset">${IC.trash}すべてのデータを削除</button>
    </section>
    <section class="card"><div class="card-h"><span class="mono">ABOUT</span><span class="mono">v1.1</span></div>
      <p class="note">DOTPLAN — 自分用のタスク＆カレンダー。オフラインでも動作します。</p></section>
  </main>`;
}

function memoStamp(ms) { const d = new Date(ms); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function vMemo() {
  const memos = live().filter((i) => i.kind === 'memo').sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
  const head = `<header class="top"><div><div class="mono">MEMO</div>
    <div class="bigline"><h1 class="big">${pad(memos.length)}<small>NOTES</small></h1></div></div></header>`;
  const quick = `<div class="card qm">
    <label class="sr" for="qmemo">クイックメモ</label>
    <textarea id="qmemo" rows="2" placeholder="思いついたことをメモ…" maxlength="5000">${esc(st.qmemo)}</textarea>
    <div class="qm-f"><span class="mono">QUICK NOTE</span><button class="mini dark" data-action="quickMemo">追加</button></div></div>`;
  const list = memos.length
    ? memos.map((m) => `<button class="card memo" data-action="editMemo" data-id="${m.id}">

function historyFor(kind) {

  live().filter((i) => i.kind === kind).forEach((i) => {

    else { e.n++; if (i.createdAt > e.it.createdAt) e.it = i; }

}

  if (!end || end < d.date) return [];

  for (let k = 0; k < 731 && cur <= end && out.length < 200; k++) {

function saveSheet() {
  const s = st.sheet; if (!s) return;
  const d = s.d;
  if (d.kind === 'memo') {
    if (!(d.note || '').trim()) { toast('メモを入力してください'); return; }
    const now = Date.now();
    if (s.id) { const it = db.items.find((i) => i.id === s.id); if (it) Object.assign(it, cleanItem({ ...it, note: d.note, pinned: d.pinned }), { updatedAt: now }); }
    else { const it = cleanItem({ kind: 'memo', note: d.note, pinned: d.pinned, id: uid(), createdAt: now, updatedAt: now }); if (it) db.items.push(it); }
    save(); closeSheet(); render(true); toast('保存しました');
    return;
  }
  d.title = (d.title || '').trim();
  if (!d.title) { s.err = true; renderSheet(); toast('タイトルを入力してください'); const f = $('#f-title'); if (f) f.focus(); return; }
  if (d.kind === 'event') {
    if (!d.date) d.date = todayStr();
    if (d.allDay) { d.time = null; d.end = null; }
    else {
      if (!d.time) d.time = defaultStart();
      if (!d.end || toMin(d.end) <= toMin(d.time)) d.end = minToT(Math.min(toMin(d.time) + 60, 1439));
    }
  } else {
    d.allDay = false; d.end = null; d.place = '';
    if (!d.date) d.time = null;
  }
  const now = Date.now();
  if (s.id) {
    const it = db.items.find((i) => i.id === s.id);
    if (it) Object.assign(it, cleanItem({ ...it, ...d, id: it.id, createdAt: it.createdAt }), { updatedAt: now });
    if (it && d.applyFuture && it.series && it.date) {
      live().filter((x) => x.series === it.series && x.id !== it.id && x.date && x.date > it.date).forEach((x) => {
        Object.assign(x, { title: it.title, cat: it.cat, time: it.time, end: it.end, allDay: it.allDay, place: it.place, prio: it.prio, note: it.note, updatedAt: now });
      });
    }
  } else if (d.repOn) {
    const dates = repDates(d);
    if (!dates.length) { toast('繰り返す曜日と期間を選んでください'); return; }
    const series = uid();
    dates.forEach((ds, k) => {
      const it = cleanItem({ ...d, date: ds, series, id: uid(), done: false, createdAt: now + k, updatedAt: now, deleted: false });
      if (it) db.items.push(it);
    });
    save(); closeSheet(); render(true); toast(`${dates.length}件追加しました`);
    return;
  } else {
    const it = cleanItem({ ...d, id: uid(), done: false, createdAt: now, updatedAt: now, deleted: false });
    if (it) db.items.push(it);
  }
  save(); closeSheet(); render(true); toast('保存しました');
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, act, fn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button">${esc(act)}</button>` : ''}`;
  el.classList.toggle('has-act', !!act);
  if (act) el.querySelector('button').onclick = () => { fn(); el.classList.remove('show'); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), act ? 4500 : 2200);
}

/* ---------- backup ---------- */
async function exportData() {
  const name = `dotplan-backup-${todayStr()}.json`;
  const json = JSON.stringify({ app: 'dotplan', exportedAt: new Date().toISOString(), ...db }, null, 2);
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = normalize(JSON.parse(r.result));
      if (!confirm(`バックアップの ${data.items.filter((i) => !i.deleted).length} 件で、今のデータを置き換えます。よろしいですか？`)) return;
      db = data; save(); render(); toast('復元しました');
    } catch (e) { toast('このファイルは読み込めませんでした'); }
  };
  r.readAsText(file);
}

    if (!confirm('すべてのタスクと予定を削除します。この操作は元に戻せません。')) return;
    if (!confirm('本当に削除しますか？（先にバックアップを書き出すことをおすすめします）')) return;
    db = freshDb(); save(); render(); toast('すべて削除しました');
  }
};
function shiftMonth(n) {
  const d = new Date(st.calY, st.calM + n, 1); st.calY = d.getFullYear(); st.calM = d.getMonth();
  const t = new Date();
  st.calSel = (d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth()) ? todayStr() : ymd(d);
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = A[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'qmemo') { st.qmemo = e.target.value; return; }
  const f = e.target.dataset && e.target.dataset.field;
  if (f && st.sheet) {
    st.sheet.d[f] = e.target.value;
    if ((f === 'date' || f === 'repUntil') && st.sheet.d.repOn) { const r = $('#repInfo'); if (r) r.innerHTML = repInfoText(st.sheet.d); }
    if (f === 'title' && st.sheet.err && e.target.value.trim()) { st.sheet.err = false; e.target.classList.remove('err'); }
  }
});
document.addEventListener('change', (e) => {
  const c = e.target.dataset && e.target.dataset.cat;
  if (c) { db.cats[c] = e.target.value.trim().slice(0, 20) || DEFAULT_CATS[c]; e.target.value = db.cats[c]; save(); toast('カテゴリ名を変更しました'); }
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) importData(e.target.files[0]);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'f-title') { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.cat) e.target.blur();
});

/* swipe: week strip ±1 week, calendar ±1 month */
let sx = 0, sy = 0, sEl = null;
document.addEventListener('touchstart', (e) => { const el = e.target.closest('[data-swipe]'); sEl = el; if (el) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!sEl) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const dir = dx < 0 ? 1 : -1;
    if (sEl.dataset.swipe === 'week') { st.sel = addDays(st.sel, 7 * dir); render(true); }
    else shiftMonth(dir);
  }
  sEl = null;
}, { passive: true });

/* keep "today" and NOW fresh */
let lastDay = todayStr();
setInterval(() => {
  if (st.sheet) return;
  const t = todayStr();
  if (t !== lastDay) { if (st.sel === lastDay) st.sel = t; lastDay = t; render(true); }
  else if (st.view === 'today') render(true);
}, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || st.sheet) return;
  const t = todayStr(); if (t !== lastDay) { if (st.sel === lastDay) st.sel = t; lastDay = t; }
  render(true);
});

/* ---------- boot ---------- */
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
</body>
