<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOTPLAN</title>
<meta name="description" content="タスクと予定をまとめて管理する自分用アプリ">
<meta name="theme-color" content="#F6F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DOTPLAN">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Murecho:wght@400;500;700&display=swap">
<style>
/* DOTPLAN v2 — 白い紙に、墨・透ける青・黄色の3版で刷ったような見た目。
   重なった青と黄色は multiply で緑に混ざる（シルクスクリーンの刷り重ね）。
   「点」= 1つの予定・1つのがんばり。点の色と重なりで状態を伝える */
:root{
  --bg:#F6F6F3;--card:#FFFFFF;--ink:#151515;--muted:#666660;--dim:#8E8E88;
  --line:#151515;--hair:#D9D9D3;--seg:#E6E6E1;
  --blue:#1F6FD6;--blue-t:rgba(31,111,214,.78);--blue-w:rgba(31,111,214,.16);
  --yel:#FFD21F;--yel-t:rgba(255,210,31,.88);--yel-w:rgba(255,210,31,.42);
  --red:var(--blue);--redt:var(--blue);
  --dot:'Bungee','Murecho','Hiragino Sans',sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --jp:'Murecho',-apple-system,'Hiragino Sans',sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--jp);-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
#app{position:absolute;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(var(--sb) + 112px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s{width:14px;height:14px}.ic.l{width:26px;height:26px;stroke-width:2.2}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.dot{font-family:var(--dot);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mul{mix-blend-mode:multiply}
.hl{background:linear-gradient(transparent 52%,var(--yel-t) 52%,var(--yel-t) 92%,transparent 92%);padding:0 2px}

/* header：日付の数字の後ろに、黄色の丸を少しずらして刷る */
.top{padding:calc(var(--st) + 18px) 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigline{display:flex;align-items:baseline;gap:10px;margin-top:6px;position:relative}
.big{margin:0;font-family:var(--dot);font-weight:400;font-size:60px;line-height:.95;position:relative;isolation:isolate;letter-spacing:-.02em}
.big::before{content:"";position:absolute;z-index:-1;width:.9em;height:.9em;border-radius:50%;background:var(--yel-t);left:-.12em;top:.12em;mix-blend-mode:multiply}
.big small{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:.1em}
.wd{font-size:15px;font-weight:700}
.reddot{width:10px;height:10px;border-radius:5px;background:var(--blue-t);align-self:flex-start;margin-top:6px}
.hbtns{display:flex;gap:6px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.pill{height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--ink);background:var(--card);font-size:14px;font-weight:700}

/* week：丸い点が7つ。選んだ日は青、今日は黄色の丸が後ろに */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 14px 14px;touch-action:pan-y}
.wk{height:66px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;position:relative;isolation:isolate}
.wk .s{font-size:11px;color:var(--muted)}
.wk .d{font-family:var(--dot);font-size:15px;width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--hair);background:var(--card)}
.wk .p{width:5px;height:5px;border-radius:3px}
.wk.has .p{background:var(--ink)}
.wk.today .d{border-color:var(--ink)}
.wk.today .d::after{content:"";position:absolute;z-index:-1;width:38px;height:38px;border-radius:19px;background:var(--yel-t);transform:translate(4px,4px);mix-blend-mode:multiply}
.wk.sel .d{background:var(--blue-t);border-color:transparent;color:#fff}
.wk.sel .s{color:var(--ink);font-weight:700}

/* cards：紙の上の区画。角は小さく、線は墨 */
.card{display:block;width:100%;background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:8px 16px;margin:0 0 12px;text-align:left}
.card.print{box-shadow:4px 4px 0 var(--blue-t)}
.card.yel{box-shadow:4px 4px 0 var(--yel-t)}
.card-h{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:8px}
.link{border:none;background:none;padding:10px 0;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}
.count{font-family:var(--dot);font-size:18px}.count span{color:var(--dim)}
.empty{padding:14px 0 16px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted)}

/* now */
.now{padding:16px}
.now .top2{display:flex;justify-content:space-between;align-items:center}
.live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue)}
.live i{width:8px;height:8px;border-radius:4px;background:var(--blue);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.now .mid{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 0}
.now .ttl{font-size:21px;font-weight:700;display:block}
.now .sub{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.now .rng{font-family:var(--dot);font-size:19px;line-height:1;white-space:nowrap}
.now .rng span{color:var(--dim)}
.segs{display:grid;gap:3px}
.segs i{height:8px;border-radius:4px;background:var(--seg)}
.segs i.on{background:var(--blue-t)}.segs i.cur{background:var(--yel)}
.bar{height:8px;border-radius:4px;background:var(--seg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue-t);border-radius:4px}

/* rows */
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border:none;border-top:1px solid var(--hair);background:none;text-align:left;min-height:52px}
.row .tm{width:56px;flex-shrink:0;font-family:var(--dot);font-size:14px}
.row .tm.txt{font-family:var(--jp);font-size:13px;font-weight:700}
.row .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .rt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.row .rs{font-size:12px;color:var(--muted)}
.row.past{color:var(--dim)}.row.past .rt{text-decoration:line-through}
.trow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--hair);margin-left:-8px}
.chk{width:44px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;isolation:isolate}
.chk span{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s}
.chk svg{opacity:0;width:14px;height:14px;stroke-width:3}
.trow.done .chk span{background:var(--blue-t);border-color:transparent}
.trow.done .chk span::after{content:"";position:absolute;z-index:-1;width:22px;height:22px;border-radius:11px;background:var(--yel-t);transform:translate(3px,3px);mix-blend-mode:multiply}
.trow.done .chk svg{opacity:1}
.tb{flex:1;min-width:0;border:none;background:none;padding:10px 0;text-align:left;display:flex;flex-direction:column;gap:4px}
.tb .tt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.trow.done .tt{color:var(--dim);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta .sl{color:var(--hair)}.meta .urg{color:var(--ink);font-weight:700;background:linear-gradient(transparent 50%,var(--yel-t) 50%)}
.hi{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink);background:var(--yel);border-radius:3px;padding:1px 6px;letter-spacing:.08em}
.decl{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--blue-t);border-radius:3px;padding:1px 6px;letter-spacing:.06em;display:inline-flex;align-items:center;gap:4px}

/* markers：課題=青の点、バイト=黄の点(墨のふち)、個人=墨の四角 */
.mk{display:inline-block;width:8px;height:8px;flex-shrink:0}
.mk-dot{background:var(--blue-t);border-radius:4px}
.mk-ring{background:var(--yel);border:1.5px solid var(--ink);border-radius:4px}
.mk-square{background:var(--ink);border-radius:1px}
.legend{display:flex;gap:16px;padding:0 20px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

/* calendar */
.cal{background:var(--card);border:1.5px solid var(--ink);border-radius:8px;margin:0 14px;padding:12px 8px 10px;touch-action:pan-y}
.cal .dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);padding-bottom:6px}
.cal .dows span:first-child{color:var(--blue)}
.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cc{height:50px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;color:var(--ink);position:relative;isolation:isolate}
.cc .n{font-family:var(--dot);font-size:12.5px;width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.cc .mks{display:flex;gap:3px;height:6px}.cc .mk{width:6px;height:6px}
.cc.out{color:#A5A5A0}
.cc.today .n::after{content:"";position:absolute;z-index:-1;width:30px;height:30px;border-radius:15px;background:var(--yel-t);transform:translate(3px,3px);mix-blend-mode:multiply}
.cc.today .n{border:1.5px solid var(--ink)}
.cc.sel .n{background:var(--blue-t);color:#fff;border-color:transparent}
.agh{display:flex;justify-content:space-between;align-items:baseline;padding:18px 6px 10px}
.agh h2{margin:0;font-size:16px;font-weight:700}
.dash{border:1.5px dashed var(--dim);border-radius:8px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}

/* tasks view */
.segc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:24px;border:1.5px solid var(--ink);background:var(--card);margin:0 14px 12px}
.segc.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.segc button{height:38px;border:none;border-radius:20px;background:none;font-size:14px;font-weight:700;color:var(--muted)}
.segc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.grp.red{color:var(--ink);background:var(--yel);padding:1px 6px;border-radius:3px}
.textbtn{width:100%;min-height:52px;border:none;border-top:1px solid var(--hair);background:none;text-align:left;font-size:15px;font-weight:500;padding:0;display:flex;align-items:center;gap:12px}
.textbtn.red{color:var(--blue)}

/* settings */
.field{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--hair)}
.field:first-of-type{border-top:none}
.field input[type=text]{flex:1;min-width:0;border:none;background:none;font-size:16px;padding:10px 0;outline:none}
.note{font-size:13px;line-height:1.7;color:var(--muted);padding:4px 0 12px;margin:0}
.note b{color:var(--ink);font-weight:700}

/* fab：青い丸の後ろに黄色の丸をずらして刷る（重なりが緑になる） */
.fab{position:absolute;right:20px;bottom:calc(var(--sb) + 86px);width:60px;height:60px;border-radius:30px;border:none;background:var(--blue-t);color:#fff;display:flex;align-items:center;justify-content:center;z-index:5;isolation:isolate}
.fab::before{content:"";position:absolute;inset:0;border-radius:30px;background:var(--yel-t);transform:translate(6px,6px);z-index:-1;mix-blend-mode:multiply}
.tabbar{position:absolute;left:0;right:0;bottom:0;padding:6px 8px calc(var(--sb) + 6px);background:var(--card);border-top:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;z-index:6}
.tab{height:56px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:var(--muted);padding:0}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab .lb{padding:0 3px}
.tab[aria-current="page"] .lb{background:linear-gradient(transparent 45%,var(--yel-t) 45%)}

/* sheet */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-head{padding:calc(var(--st) + 12px) 16px 8px;display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center}
.sh-head h2{margin:0;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em}
.save{justify-self:end;height:44px;padding:0 20px;border-radius:22px;border:none;background:var(--blue);color:#fff;font-size:15px;font-weight:700}
.sh-body{padding-top:14px;padding-bottom:calc(var(--sb) + 40px)}
.fcard{background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:16px 16px 18px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.fcard.rows{padding:6px 16px;gap:0}
.tinput{height:48px;border:none;border-bottom:1.5px solid var(--ink);background:none;padding:0;font-size:20px;font-weight:700;outline:none;width:100%}
.tinput.err{border-bottom-color:var(--blue);background:var(--yel-w)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:42px;padding:0 16px;border-radius:21px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.frow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--hair)}
.frow:first-child{border-top:none}
.frow .lab{flex:1;font-size:15px;white-space:nowrap}
.frow .ic{color:var(--muted)}
.frow input[type=date],.frow input[type=time]{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;height:40px;padding:0 10px;font-family:var(--mono);font-size:15px;color:var(--ink);-webkit-appearance:none;appearance:none;min-width:0}
.frow input[type=text]{flex:1;min-width:0;border:none;background:none;font-size:16px;text-align:right;outline:none;padding:10px 0}
.mini{height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--ink);background:var(--card);font-size:13px;font-weight:700}
.sw{width:52px;height:32px;border-radius:16px;border:1.5px solid var(--ink);padding:3px;background:var(--card);display:flex;flex-shrink:0}
.sw span{width:23px;height:23px;border-radius:12px;background:var(--ink);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--blue-t);border-color:var(--blue)}
.sw[aria-checked="true"] span{background:var(--yel);transform:translateX(19px)}
.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.prio button{height:46px;border-radius:23px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink)}
.prio .bars{display:flex;gap:2px;align-items:flex-end}
.prio .bars i{width:3px;border-radius:1px;background:var(--hair)}
.prio .bars i.on{background:currentColor}
.prio button[aria-pressed="true"]{background:var(--ink);color:#fff}
.prio button.h[aria-pressed="true"]{background:var(--yel);color:var(--ink)}
.prio button[aria-pressed="true"] .bars i:not(.on){background:rgba(255,255,255,.35)}
textarea{width:100%;border:none;background:none;font-size:16px;line-height:1.6;resize:none;outline:none;padding:0}
.del{width:100%;height:52px;border-radius:26px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-size:15px;font-weight:700;margin-top:6px}
.del + .del{margin-top:10px}
.hist{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hchip{flex-shrink:0;height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;max-width:240px}
.hchip span:not(.mk):not(.dot){overflow:hidden;text-overflow:ellipsis}
.hchip .dot{font-size:12px;color:var(--muted)}
.hchip:active{background:var(--ink);color:#fff}
.repbox{display:flex;flex-direction:column;gap:12px;padding:6px 0 16px;border-top:1px solid var(--hair)}
.wd7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding-top:8px}
.wd7 button{height:44px;border-radius:22px;border:1.5px solid var(--ink);background:var(--card);font-size:14px;font-weight:700;padding:0}
.wd7 button.sun{color:var(--blue)}
.wd7 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.segc.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.segc.four button{font-size:12px;height:34px}
.qm{padding:14px 16px 10px}
.qm textarea{font-size:16px;min-height:52px}
.qm-f{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--hair);padding-top:8px;margin-top:6px}
.mini.dark{background:var(--ink);border-color:var(--ink);color:#fff;height:40px;padding:0 18px}
.mini.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.mini.yel{background:var(--yel);border-color:var(--ink);color:var(--ink)}
.memo{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.mtx{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mft{display:flex;justify-content:space-between;align-items:center}
.pinned{display:flex;align-items:center;gap:4px;color:var(--blue)}.pinned .mono{color:var(--blue)}
.pinned .ic{width:14px;height:14px}

/* ===== なかま（共有のプロトタイプ） ===== */
.demo{margin:0 14px 12px;font-size:12px;line-height:1.6;color:var(--muted);border:1.5px dashed var(--dim);border-radius:8px;padding:8px 12px}
.demo b{color:var(--ink)}
.me{display:flex;align-items:center;gap:14px;padding:14px 16px}
.pdot{position:relative;isolation:isolate;width:46px;height:46px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pdot::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1}
.pdot.free::before{background:var(--yel-t)}
.pdot.busy::before{background:transparent;border:1.5px dashed var(--ink)}
.pdot.focus::before{background:var(--blue-t)}
.pdot.focus{color:#fff}
.pdot.focus::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--blue-t);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.pdot.sm{width:30px;height:30px;font-size:12px}
.pdot.sm.focus::after{inset:-4px}
.stx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stx b{font-size:16px}
.stx span{font-size:12px;color:var(--muted)}
.state{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px;border:1.2px solid var(--ink);white-space:nowrap}
.state.free{background:var(--yel)}
.state.focus{background:var(--blue);color:#fff;border-color:var(--blue)}
.gtabs{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px 6px;padding:6px 0 10px}
.mem{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;min-width:0}
.mem .pdot{width:52px;height:52px;font-size:16px}
.mem .nm{font-size:13px;font-weight:700}
.mem .when{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
/* 空き時間の重なり：一人ぶんの空きを薄い青で刷り重ねる→たくさん重なるほど濃くなる */
.ovl{padding:4px 0 6px}
.track{position:relative;height:34px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.track i{position:absolute;top:0;bottom:0;background:rgba(31,111,214,.24);mix-blend-mode:multiply}
.track .best{position:absolute;top:-1px;bottom:-1px;border:2.5px solid var(--ink);border-radius:4px;background:var(--yel-w);mix-blend-mode:multiply}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.lane{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.lane .ln{position:relative;height:6px;background:var(--seg);border-radius:3px;overflow:hidden}
.lane .ln i{position:absolute;top:0;bottom:0;background:var(--yel);border-radius:3px}
.bestbox{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--hair);padding:12px 0 6px;margin-top:10px}
.bestbox b{font-family:var(--dot);font-weight:400;font-size:16px}
.cd{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cd i{width:12px;height:12px;border-radius:6px;border:1.5px solid var(--blue)}
.cd i.past{background:var(--blue-t);border-color:transparent}
.cd i.td{background:var(--yel);border-color:var(--ink)}
.dl{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--hair)}
.dl:first-of-type{border-top:none}
.dl .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dl .h b{font-size:15px}
.dl .left{font-family:var(--jp);font-weight:700;font-size:14px;white-space:nowrap}
.dl .who{font-size:12px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.some{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--hair)}
.some .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.some .tx b{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.some .tx span{font-size:11px;color:var(--muted)}
.addrow{display:flex;gap:8px;padding:6px 0 10px}
.addrow input{flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--ink);background:none;font-size:15px;padding:8px 0;outline:none}
.cheer{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cheer span{border:1.2px solid var(--ink);border-radius:12px;padding:2px 8px;background:var(--card);color:var(--ink)}
.watch{display:flex;flex-wrap:wrap;gap:8px}
.watch .chip{height:38px;padding:0 12px;font-size:13px}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 160px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:24px;padding:0 8px 0 18px;min-height:48px;display:flex;align-items:center;gap:8px;font-size:14px;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 40px)}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:none;background:none;color:var(--yel);font-weight:700;height:40px;padding:0 10px;white-space:nowrap}
.toast:not(.has-act){padding-right:18px}
@media (prefers-reduced-motion:reduce){.pdot.focus::after,.live i{animation:none}.sheet{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <button class="fab" data-action="add" aria-label="追加"><svg class="ic l" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" aria-label="メイン">
    <button class="tab" data-action="tab" data-view="today"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span class="lb">今日</span></button>
    <button class="tab" data-action="tab" data-view="calendar"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="lb">カレンダー</span></button>
    <button class="tab" data-action="tab" data-view="tasks"><svg class="ic" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="lb">タスク</span></button>
    <button class="tab" data-action="tab" data-view="friends"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg><span class="lb">なかま</span></button>
    <button class="tab" data-action="tab" data-view="memo"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4M9 12h6M9 16h4"/></svg><span class="lb">メモ</span></button>
  </nav>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="編集"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

/* ---------- constants & utils ---------- */
const KEY = 'dotplan:v1';
const DOW_JP = ['日','月','火','水','木','金','土'];
const DOW_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const CAT_IDS = ['k','b','p'];
const SHAPE = { k:'dot', b:'ring', p:'square' };
const DEFAULT_CATS = { k:'課題', b:'バイト', p:'個人' };
const PRIO_RANK = { h:0, m:1, l:2 };

const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMin = (t) => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60 + m; };
const minToT = (m) => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const jpDate = (s) => { const d = parse(s); return `${d.getMonth()+1}月${d.getDate()}日（${DOW_JP[d.getDay()]}）`; };
const shortDate = (s) => { const d = parse(s); return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = (s) => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);

const IC = {
  check: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left: '<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  rightS: '<svg class="ic s" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  close: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cal: '<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  sun: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  plus: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  out: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>',
  inn: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>',
  trash: '<svg class="ic" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></svg>',
  gear: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  repeat: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>',
  pinI: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3v1.5H7V12l3-3z"/><path d="M12 13.5V20"/></svg>',
  eye: '<svg class="ic" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  toTask: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/></svg>'
};
const mk = (c) => `<span class="mk mk-${SHAPE[c] || 'dot'}" aria-hidden="true"></span>`;

/* ---------- storage (sync-ready: ids, updatedAt, soft delete) ---------- */
function freshDb() { return { version: 1, cats: { ...DEFAULT_CATS }, items: [] }; }
function cleanItem(x) {
  if (!x || typeof x !== 'object') return null;
  const kind = ['event', 'memo'].includes(x.kind) ? x.kind : 'task';
  const note = String(x.note ?? '').slice(0, 5000);
  let title = String(x.title ?? '').slice(0, 200).trim();
  if (kind === 'memo') {
    if (!note.trim()) return null;
    title = note.trim().split('\n')[0].slice(0, 200);
  }
  if (!title) return null;
  return {
    id: typeof x.id === 'string' && x.id ? x.id : uid(),
    kind, title,
    cat: CAT_IDS.includes(x.cat) ? x.cat : 'k',
    date: isDate(x.date) ? x.date : null,
    time: isTime(x.time) ? x.time : null,
    end: isTime(x.end) ? x.end : null,
    allDay: !!x.allDay,
    place: String(x.place ?? '').slice(0, 200),
    prio: ['h','m','l'].includes(x.prio) ? x.prio : 'm',
    note,
    series: typeof x.series === 'string' && x.series ? x.series.slice(0, 64) : null,
    pinned: !!x.pinned,
    done: !!x.done,
    createdAt: Number(x.createdAt) || Date.now(),
    updatedAt: Number(x.updatedAt) || Date.now(),
    deleted: !!x.deleted
  };
}
function normalize(d) {
  const out = freshDb();
  if (d && typeof d === 'object') {
    if (d.cats && typeof d.cats === 'object') CAT_IDS.forEach((k) => { if (typeof d.cats[k] === 'string' && d.cats[k].trim()) out.cats[k] = d.cats[k].trim().slice(0, 20); });
    if (Array.isArray(d.items)) out.items = d.items.map(cleanItem).filter(Boolean);
  }
  return out;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return freshDb();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('保存できませんでした（空き容量を確認してください）'); }
}
let db = load();
const live = () => db.items.filter((i) => !i.deleted);
const catName = (c) => db.cats[c] || DEFAULT_CATS[c] || '';

/* ---------- state ---------- */
const t0 = new Date();
const st = {
  view: 'today',
  sel: todayStr(),
  calY: t0.getFullYear(), calM: t0.getMonth(), calSel: todayStr(),
  taskTab: 'open',
  qmemo: '',
  someDraft: '',
  sheet: null
};

/* ---------- queries ---------- */
const eventSort = (a, b) => (b.allDay - a.allDay) || ((toMin(a.time) ?? 0) - (toMin(b.time) ?? 0)) || (a.createdAt - b.createdAt);
const taskSort = (a, b) => (a.done - b.done)
  || ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0)
  || ((toMin(a.time) ?? 1e4) - (toMin(b.time) ?? 1e4))
  || (PRIO_RANK[a.prio] - PRIO_RANK[b.prio])
  || (a.createdAt - b.createdAt);
const eventsOn = (d) => live().filter((i) => i.kind === 'event' && i.date === d).sort(eventSort);
const eventEnd = (e) => toMin(e.end) ?? ((toMin(e.time) ?? 0) + 60);

function dueInfo(i) {
  const t = todayStr();
  if (!i.date) return { text: '期限なし', urgent: false };
  if (!i.done && i.date < t) return { text: '期限切れ ' + shortDate(i.date), urgent: true };
  let text = i.date === t ? '今日' : i.date === addDays(t, 1) ? '明日' : `${shortDate(i.date)} ${DOW_JP[parse(i.date).getDay()]}`;
  if (i.time) text += ' ' + i.time;
  let urgent = false;
  if (!i.done && i.date === t) urgent = i.prio === 'h' || (i.time ? toMin(i.time) - nowMin() <= 180 : false);
  return { text, urgent };
}

/* ---------- row builders ---------- */
function taskRow(i) {
  const due = dueInfo(i);
  return `<div class="trow${i.done ? ' done' : ''}">
    <button class="chk" data-action="toggle" data-id="${i.id}" aria-label="${i.done ? '未完了に戻す' : '完了にする'}：${esc(i.title)}"><span>${IC.check}</span></button>
    <button class="tb" data-action="edit" data-id="${i.id}">
      <span class="tt">${esc(i.title)}</span>
      <span class="meta">${mk(i.cat)}<span>${esc(catName(i.cat))}</span><span class="sl">/</span><span class="${due.urgent ? 'urg' : ''}">${due.text}</span>${i.prio === 'h' && !i.done ? '<span class="hi">HIGH</span>' : ''}${so.decl[i.id] && !i.done ? `<span class="decl">${IC.eye.replace('class="ic"','class="ic s"')}宣言 ${shortDate(so.decl[i.id].due)}</span>` : ''}</span>
    </button>
  </div>`;
}
function eventRow(e, dimPast) {
  const past = dimPast && !e.allDay && eventEnd(e) <= nowMin();
  const tm = e.allDay ? '<span class="tm txt">終日</span>' : `<span class="tm">${e.time || ''}</span>`;
  const sub = [e.allDay ? '' : (e.end ? `〜${e.end}` : ''), e.place ? esc(e.place) : ''].filter(Boolean).join('　');
  return `<button class="row${past ? ' past' : ''}" data-action="edit" data-id="${e.id}">${tm}
    <span class="rb"><span class="rt">${esc(e.title)}</span>${sub ? `<span class="rs">${sub}</span>` : ''}</span>
    ${past ? '<span class="mono">DONE</span>' : mk(e.cat)}</button>`;
}
function segBar(done, total) {
  if (!total) return '';
  if (total > 12) return `<div class="bar" style="margin-bottom:10px"><i style="width:${Math.round(done / total * 100)}%"></i></div>`;
  let s = '';
  for (let k = 0; k < total; k++) s += `<i class="${k < done ? 'on' : ''}"></i>`;
  return `<div class="segs" style="grid-template-columns:repeat(${total},minmax(0,1fr));margin-bottom:10px">${s}</div>`;
}

/* ---------- views ---------- */
function vToday() {
  const t = todayStr(), s = st.sel, d = parse(s), isT = s === t, nm = nowMin();
  const head = `<header class="top"><div>
      <div class="mono">${DOW_EN[d.getDay()]} — ${d.getFullYear()}.${pad(d.getMonth()+1)}</div>
      <div class="bigline"><h1 class="big">${pad(d.getDate())}</h1><span class="wd">${DOW_JP[d.getDay()]}曜日</span>${isT ? '<span class="reddot mul" title="今日"></span>' : ''}</div>
    </div><div class="hbtns">${isT ? '' : '<button class="pill" data-action="goToday">今日へ</button>'}<button class="iconbtn" data-action="tab" data-view="settings" aria-label="設定">${IC.gear}</button></div></header>`;

  const ws = addDays(s, -d.getDay());
  const dates = new Set(live().map((i) => i.date));
  let wk = '';
  for (let k = 0; k < 7; k++) {
    const ds = addDays(ws, k);
    wk += `<button class="wk${ds === s ? ' sel' : ''}${ds === t ? ' today' : ''}${dates.has(ds) ? ' has' : ''}" data-action="selDay" data-date="${ds}" aria-label="${jpDate(ds)}"${ds === s ? ' aria-current="date"' : ''}>
      <span class="s">${DOW_JP[k]}</span><span class="d">${parse(ds).getDate()}</span><span class="p"></span></button>`;
  }

  const evs = eventsOn(s);
  let now = '';
  if (isT) {
    const timed = evs.filter((e) => !e.allDay && e.time);
    const cur = timed.find((e) => toMin(e.time) <= nm && nm < eventEnd(e));
    if (cur) {
      const a = toMin(cur.time), b = eventEnd(cur);
      const f = Math.min(23, Math.floor((nm - a) / (b - a) * 24));
      let sg = ''; for (let k = 0; k < 24; k++) sg += `<i class="${k < f ? 'on' : k === f ? 'cur' : ''}"></i>`;
      now = `<button class="card now" data-action="edit" data-id="${cur.id}">
        <span class="top2"><span class="mono">NOW</span><span class="live"><i></i>進行中</span></span>
        <span class="mid"><span><span class="ttl">${esc(cur.title)}</span>${cur.place ? `<span class="sub">${esc(cur.place)}</span>` : ''}</span>
        <span class="rng">${cur.time}<span>–${minToT(Math.min(b, 1439))}</span></span></span>
        <span class="segs" style="grid-template-columns:repeat(24,minmax(0,1fr))">${sg}</span></button>`;
    } else {
      const nx = timed.find((e) => toMin(e.time) > nm);
      if (nx) {
        const diff = toMin(nx.time) - nm;
        const rel = diff < 60 ? `あと${diff}分` : `あと${Math.floor(diff / 60)}時間${diff % 60 ? (diff % 60) + '分' : ''}`;
        now = `<button class="card now" data-action="edit" data-id="${nx.id}">
          <span class="top2"><span class="mono">NEXT</span><span class="live" style="color:var(--muted)">${rel}</span></span>
          <span class="mid" style="margin-bottom:0"><span><span class="ttl">${esc(nx.title)}</span>${nx.place ? `<span class="sub">${esc(nx.place)}</span>` : ''}</span>
          <span class="rng">${nx.time}${nx.end ? `<span>–${nx.end}</span>` : ''}</span></span></button>`;
      }
    }
  }

  const sched = `<section class="card" aria-label="予定">
    <div class="card-h"><span class="mono">SCHEDULE</span><button class="link" data-action="toCal">カレンダー${IC.rightS}</button></div>
    ${evs.length ? evs.map((e) => eventRow(e, isT)).join('') : '<div class="empty">予定はありません</div>'}
  </section>`;

  const tl = live().filter((i) => i.kind === 'task' && (i.date === s || (isT && i.date && i.date < t && !i.done))).sort(taskSort);
  const dn = tl.filter((i) => i.done).length;
  const tasks = `<section class="card" aria-label="タスク" style="padding-bottom:6px">

function vCal() {

  const isCur = y === t0now().getFullYear() && m === t0now().getMonth();

  const cal = `<div class="cal" data-swipe="month"><div class="dows">${DOW_EN.map((x) => `<span>${x}</span>`).join('')}</div><div class="grid">${cells}</div></div>`;

  const s = st.calSel;

  const n = evs.length + tks.length;

  if (!n) {

  } else {

    if (tks.length) agenda += `<section class="card" style="padding-bottom:6px"><div class="card-h"><span class="mono">TASKS</span></div>${tks.map(taskRow).join('')}</section>`;
  }
  return `${head}${legend}${cal}<main class="scroll">${agenda}</main>`;
}

function historyFor(kind) {
  const map = new Map();
  live().filter((i) => i.kind === kind).forEach((i) => {
    const e = map.get(i.title);
    if (!e) map.set(i.title, { it: i, n: 1 });
    else { e.n++; if (i.createdAt > e.it.createdAt) e.it = i; }
  });
  return [...map.values()].sort((a, b) => (b.n - a.n) || (b.it.createdAt - a.it.createdAt)).slice(0, 8).map((x) => x.it);
}
function repDates(d) {
  if (!d.date || !d.repDays || !d.repDays.length) return [];
  const end = d.repSpan === 'date' ? (isDate(d.repUntil) ? d.repUntil : null) : addDays(d.date, Number(d.repSpan) * 7 - 1);
  if (!end || end < d.date) return [];
  const out = [];
  let cur = d.date;
  for (let k = 0; k < 731 && cur <= end && out.length < 200; k++) {
    if (d.repDays.includes(parse(cur).getDay())) out.push(cur);
    cur = addDays(cur, 1);
  }
  return out;
}
function repInfoText(d) {
  const ds = repDates(d);
  if (!ds.length) return '曜日と期間を選んでください';
  return `${jpDate(ds[0])} 〜 ${jpDate(ds[ds.length - 1])}　<b>${ds.length}件</b>をまとめて追加します`;
}

    else {
      if (!d.time) d.time = defaultStart();
      if (!d.end || toMin(d.end) <= toMin(d.time)) d.end = minToT(Math.min(toMin(d.time) + 60, 1439));
    }
  } else {
    d.allDay = false; d.end = null; d.place = '';
    if (!d.date) d.time = null;
  }
  const now = Date.now();
  if (s.id) {
    const it = db.items.find((i) => i.id === s.id);
    if (it) Object.assign(it, cleanItem({ ...it, ...d, id: it.id, createdAt: it.createdAt }), { updatedAt: now });
    if (it && d.applyFuture && it.series && it.date) {
      live().filter((x) => x.series === it.series && x.id !== it.id && x.date && x.date > it.date).forEach((x) => {
        Object.assign(x, { title: it.title, cat: it.cat, time: it.time, end: it.end, allDay: it.allDay, place: it.place, prio: it.prio, note: it.note, updatedAt: now });
      });
    }
  } else if (d.repOn) {
    const dates = repDates(d);
    if (!dates.length) { toast('繰り返す曜日と期間を選んでください'); return; }
    const series = uid();
    dates.forEach((ds, k) => {
      const it = cleanItem({ ...d, date: ds, series, id: uid(), done: false, createdAt: now + k, updatedAt: now, deleted: false });
      if (it) db.items.push(it);
    });
    save(); closeSheet(); render(true); toast(`${dates.length}件追加しました`);
    return;
  } else {
    const it = cleanItem({ ...d, id: uid(), done: false, createdAt: now, updatedAt: now, deleted: false });
    if (it) { db.items.push(it); s.newId = it.id; }
  }
  applyDecl(s.id || s.newId, d);
  save(); closeSheet(); render(true); toast(d.declOn && d.kind === 'task' ? '保存して宣言しました' : '保存しました');
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, act, fn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button">${esc(act)}</button>` : ''}`;
  el.classList.toggle('has-act', !!act);
  if (act) el.querySelector('button').onclick = () => { fn(); el.classList.remove('show'); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), act ? 4500 : 2200);
}

/* ---------- backup ---------- */
async function exportData() {
  const name = `dotplan-backup-${todayStr()}.json`;
  const json = JSON.stringify({ app: 'dotplan', exportedAt: new Date().toISOString(), ...db }, null, 2);
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = normalize(JSON.parse(r.result));
      if (!confirm(`バックアップの ${data.items.filter((i) => !i.deleted).length} 件で、今のデータを置き換えます。よろしいですか？`)) return;
      db = data; save(); render(); toast('復元しました');
    } catch (e) { toast('このファイルは読み込めませんでした'); }
  };
  r.readAsText(file);
}

/* swipe: week strip ±1 week, calendar ±1 month */
let sx = 0, sy = 0, sEl = null;
document.addEventListener('touchstart', (e) => { const el = e.target.closest('[data-swipe]'); sEl = el; if (el) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!sEl) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const dir = dx < 0 ? 1 : -1;
    if (sEl.dataset.swipe === 'week') { st.sel = addDays(st.sel, 7 * dir); render(true); }
    else shiftMonth(dir);
  }
  sEl = null;
}, { passive: true });

const anchor = () => Math.floor(nowMin() / 10) * 10;
const tLabel = (m) => minToT(((Math.round(m) % 1440) + 1440) % 1440);
const grp = () => GROUPS.find((g) => g.id === so.group) || GROUPS[0];

/* 仲間の「いま」：作業中 / 予定あり（◯時から空く）/ 空いてる（◯時まで） */
function personState(pid) {
  const s = SIM[pid] || { busy: [] }, a = anchor();
  if (s.focus) return { k: 'focus', label: '作業中', sub: `${Math.max(1, a - (a + s.focus.since))}分前から` };
  const cur = s.busy.find(([x, y]) => x <= 0 && 0 < y);
  if (cur) return { k: 'busy', label: '予定あり', sub: `${tLabel(a + cur[1])}から空く`, freeAt: a + cur[1] };
  const nx = s.busy.filter(([x]) => x > 0).sort((p, q) => p[0] - q[0])[0];
  return { k: 'free', label: '空いてる', sub: nx ? `${tLabel(a + nx[0])}まで` : 'このあとずっと', freeAt: a };
}
/* 自分の「いま」：作業モード中か、カレンダーの予定から自動で決まる */
function myState() {
  const nm = nowMin();
  if (so.focus) {
    const it = find(so.focus.taskId);
    const mins = Math.max(0, Math.floor((Date.now() - so.focus.since) / 60000));
    return { k: 'focus', label: '作業中', sub: `${it ? it.title : '作業'}・${mins}分` };
  }
  const evs = eventsOn(todayStr()).filter((e) => !e.allDay && e.time);
  const cur = evs.find((e) => toMin(e.time) <= nm && nm < eventEnd(e));
  if (cur) return { k: 'busy', label: '予定あり', sub: `${minToT(Math.min(eventEnd(cur), 1439))}から空く`, freeAt: eventEnd(cur) };
  const nx = evs.find((e) => toMin(e.time) > nm);
  return { k: 'free', label: '空いてる', sub: nx ? `${nx.time}まで` : 'このあとずっと', freeAt: nm };
}
/* 自分の空き：今日のカレンダーの予定から（相手には中身を見せない） */
function myBusy() {
  const a = anchor();
  return eventsOn(todayStr()).filter((e) => !e.allDay && e.time).map((e) => [toMin(e.time) - a, eventEnd(e) - a]);
}
const WIN = 360; // いまから6時間
function freeSpans(busy) {
  const bs = busy.map(([x, y]) => [Math.max(0, x), Math.min(WIN, y)]).filter(([x, y]) => y > x).sort((p, q) => p[0] - q[0]);
  const out = []; let c = 0;
  bs.forEach(([x, y]) => { if (x > c) out.push([c, x]); c = Math.max(c, y); });
  if (c < WIN) out.push([c, WIN]);
  return out;
}
/* いちばん多くの人が空いている時間帯（60分以上）を探す */
function bestWindow(lists) {
  let best = null;
  const a = anchor();
  for (let t = 0; t <= WIN - 60; t += 10) {
    const clock = ((a + t) % 1440 + 1440) % 1440;
    if (clock >= 60 && clock < 420) continue; // 深夜1時〜朝7時は誘わない
    const who = lists.filter((l) => l.spans.some(([x, y]) => x <= t && t + 60 <= y)).map((l) => l.id);
    if (!best || who.length > best.who.length) {
      let e = t + 60;
      while (e + 10 <= WIN && lists.filter((l) => who.includes(l.id)).every((l) => l.spans.some(([x, y]) => x <= t && e + 10 <= y))) e += 10;
      best = { s: t, e, who };
    }
  }
  return best;
}
function pdot(state, label, cls = '') {

/* 締切までの日数を点で：過ぎた日=青、今日=黄、残り=輪 */
function cdDots(made, due) {
  const t = todayStr();
  const start = made && made < t ? made : t;
  let n = Math.round((parse(due) - parse(start)) / 864e5) + 1;
  n = Math.max(1, Math.min(n, 14));
  let s = '';
  for (let k = 0; k < n; k++) {
    const ds = addDays(start, k);
    s += `<i class="${ds < t ? 'past' : ds === t ? 'td' : ''}"></i>`;
  }
  return `<span class="cd" aria-hidden="true">${s}</span>`;
}

/* ---------- 今日の画面：「いまの自分」カード ---------- */

  }).join('');
  const open = live().filter((i) => i.kind === 'task' && !i.done && (i.date === todayStr() || so.decl[i.id])).sort(taskSort);
  const focusBtn = so.focus
    ? `<button class="mini dark" data-action="focusStop">作業をおわる</button>`
    : open.length ? `<button class="mini blue" data-action="focusStart">作業をはじめる</button>` : '';
  return `<section class="card ${s.k === 'focus' ? 'print' : 'yel'}" aria-label="いまの自分" style="padding:0 16px">
    <div class="me" style="padding-left:0;padding-right:0">${pdot(s, '自分')}

    <p class="note" style="border-top:1px solid var(--hair);padding-top:10px">${esc(g.name)}には「<b>${s.label}</b>${s.k === 'focus' ? '' : '・' + esc(s.sub)}」とだけ見えています。予定の中身は見えません。</p>
    ${declHtml ? `<div class="card-h" style="border-top:1px solid var(--hair)"><span class="mono">宣言中の締切</span></div>${declHtml}` : ''}
  </section>`;
}

/* ---------- なかまの画面 ---------- */
function vFriends() {
  const g = grp(), a = anchor();
  const ms = g.members.map((id) => ({ id, st: personState(id) }));
  const mine = myState();
  const head = `<header class="top"><div><div class="mono">TOGETHER — いまの点</div>
    <div class="bigline"><h1 class="big">${pad(ms.filter((m) => m.st.k === 'free').length)}<small>FREE NOW</small></h1></div></div></header>`;
  const tabs = `<div class="gtabs" role="group" aria-label="グループ">${GROUPS.map((x) => `<button class="chip" data-action="group" data-v="${x.id}" aria-pressed="${x.id === g.id}">${esc(x.name)}<span class="mono" style="color:inherit">${x.members.length + 1}</span></button>`).join('')}</div>`;
  const demo = `<p class="demo"><b>プロトタイプ：</b>仲間はデモ用の架空の人です。あなたの状態は、この端末の予定と「作業をはじめる」から決まります。</p>`;
  const people = `<section class="card" aria-label="メンバー"><div class="card-h"><span class="mono">MEMBERS</span><span class="mono">${tLabel(a)} 現在</span></div>
    <div class="members">
      <div class="mem">${pdot(mine, '自分')}<span class="nm">あなた</span><span class="when">${esc(mine.label)}</span></div>
      ${ms.map((m) => `<button class="mem" data-action="person" data-id="${m.id}" aria-label="${esc(PEOPLE[m.id])}：${m.st.label}、${m.st.sub}">${pdot(m.st, PEOPLE[m.id].slice(0, 2))}<span class="nm">${esc(PEOPLE[m.id])}</span><span class="when">${esc(m.st.sub)}</span></button>`).join('')}
    </div>
    <div class="legend" style="padding:0 0 8px"><span><span class="pdot sm free"></span>空いてる</span><span><span class="pdot sm busy"></span>予定あり</span><span><span class="pdot sm focus"></span>作業中</span></div></section>`;

  /* 空き時間の重なり */
  const lists = [{ id: 'me', spans: freeSpans(myBusy()) }, ...g.members.map((id) => ({ id, spans: freeSpans((SIM[id] || { busy: [] }).busy) }))];
  const best = bestWindow(lists);
  const pct = (m) => (m / WIN * 100).toFixed(2) + '%';
  const bars = lists.map((l) => l.spans.map(([x, y]) => `<i style="left:${pct(x)};width:${pct(y - x)}"></i>`).join('')).join('');
  const ticks = [0, 60, 120, 180, 240, 300, 360].map((m) => `<span>${tLabel(a + m)}</span>`).join('');
  const lanes = lists.map((l) => `<div class="lane"><span>${esc(nameOf(l.id))}</span><span class="ln">${l.spans.map(([x, y]) => `<i style="left:${pct(x)};width:${pct(y - x)}"></i>`).join('')}</span></div>`).join('');
  const others = best ? best.who.filter((w) => w !== 'me') : [];
  const overlap = `<section class="card print" aria-label="空き時間の重なり"><div class="card-h"><span class="mono">OVERLAP — みんなの空き</span><span class="mono">6H</span></div>
    <div class="ovl"><div class="track">${bars}${best ? `<span class="best" style="left:${pct(best.s)};width:${pct(best.e - best.s)}"></span>` : ''}</div><div class="ticks">${ticks}</div>
    <div class="lanes">${lanes}</div>
    ${best && others.length ? `<div class="bestbox"><span><span class="mono">${best.who.length}人が空いてる</span><br><b>${tLabel(a + best.s)}–${tLabel(a + best.e)}</b></span>
      <button class="mini blue" data-action="inviteAll" data-s="${a + best.s}" data-e="${a + best.e}" data-who="${others.join(',')}">この時間に誘う</button></div>` : ''}
    </div><p class="note" style="padding-bottom:6px">青が濃いところほど、空いている人が多い時間です。</p></section>`;

  /* 見守り */
  const theirs = g.members.filter((id) => SIM[id] && SIM[id].decl).map((id) => {
    const d = SIM[id].decl, due = addDays(todayStr(), d.days), made = addDays(todayStr(), d.made);
    return `<div class="dl"><div class="h"><b>${esc(PEOPLE[id])}：${esc(d.title)}</b><span class="left">${leftText(due)}</span></div>${cdDots(made, due)}
      <div class="btnrow"><button class="mini yel" data-action="cheer" data-id="${id}" data-t="おつかれ">おつかれ</button><button class="mini" data-action="cheer" data-id="${id}" data-t="進んでる？">つつく</button></div></div>`;
  }).join('');
  const mine2 = Object.entries(so.decl).filter(([id]) => { const it = find(id); return it && !it.deleted && !it.done; }).map(([id, d]) => {
    const it = find(id);
    return `<div class="dl"><div class="h"><b>あなた：${esc(it.title)}</b><span class="left">${leftText(d.due)}</span></div>${cdDots(d.made, d.due)}<span class="who">見守り：${d.watch.map(nameOf).join('・')}</span></div>`;
  }).join('');
  const watch = `<section class="card" aria-label="宣言と見守り"><div class="card-h"><span class="mono">DECLARE — 宣言と見守り</span></div>
    ${theirs || mine2 ? theirs + mine2 : '<div class="empty">まだ宣言はありません</div>'}
    <p class="note">タスクを開いて「自分締切を宣言」すると、選んだ人の画面に締切までの点が出ます。</p></section>`;

  /* いつか */
  const sl = (so.someday[g.id] || []);
  const some = `<section class="card" aria-label="いつかやりたいこと"><div class="card-h"><span class="mono">SOMEDAY — いつかやりたい</span><span class="count">${sl.length}</span></div>
    <div class="addrow"><label class="sr" for="someIn">やりたいことを追加</label><input id="someIn" type="text" maxlength="80" placeholder="行きたい・やりたいことを書く" value="${esc(st.someDraft || '')}" enterkeyhint="done"><button class="mini dark" data-action="someAdd">追加</button></div>
    ${sl.map((x) => `<div class="some"><span class="tx"><b>${esc(x.title)}</b><span>${esc(nameOf(x.by))}が追加</span></span>
      ${x.plan ? `<span class="state free">${esc(x.plan)}</span>` : `<button class="mini" data-action="someSuggest" data-id="${x.id}">この日どう？</button>`}</div>`).join('') || '<div class="empty">まだありません</div>'}
  </section>`;
  return `${head}${tabs}<main class="scroll">${demo}${people}${overlap}${watch}${some}</main>`;
}

/* 仲間の詳細シート */
function openPerson(id) {
  const s = personState(id), sim = SIM[id] || {};
  const at = s.k === 'busy' ? s.freeAt : anchor() + 10;
  st.sheet = { person: id };
  $('#sheet').innerHTML = `
    <div class="sh-head"><button class="iconbtn" data-action="closeSheet" aria-label="閉じる">${IC.close}</button><h2>${esc(PEOPLE[id])}</h2><span></span></div>
    <div class="scroll sh-body">
      <div class="fcard"><div class="me" style="padding:0">${pdot(s, PEOPLE[id].slice(0, 2))}<span class="stx"><b>${s.label}</b><span>${esc(s.sub)}</span></span></div>
        <p class="note" style="padding:0">予定の中身は共有されません。わかるのは「いまの状態」と「いつ空くか」だけです。</p></div>
      ${s.k === 'focus' ? `<div class="fcard"><span class="mono">作業中</span><p class="note" style="padding:0">いま集中しているので、誘うのは終わってからがよさそうです。</p>
        <div class="btnrow"><button class="mini yel" data-action="cheer" data-id="${id}" data-t="がんばれ">がんばれを送る</button></div></div>` : ''}
      ${sim.decl ? `<div class="fcard"><span class="mono">宣言中の締切</span><b>${esc(sim.decl.title)}　${leftText(addDays(todayStr(), sim.decl.days))}</b>${cdDots(addDays(todayStr(), sim.decl.made), addDays(todayStr(), sim.decl.days))}</div>` : ''}
      <button class="save" style="width:100%;height:52px;border-radius:26px" data-action="invite" data-id="${id}" data-s="${at}">${tLabel(at)}から誘う</button>
    </div>`;
  const el = $('#sheet'); requestAnimationFrame(() => el.classList.add('open'));
}

/* デモの返事（本物の同期はないので、少し待って仲間が答える） */
function demoReply(who, text, after, fn) {
  setTimeout(() => { toast(`${PEOPLE[who] || who}：「${text}」`, fn ? '予定に入れる' : null, fn); }, after);
}
function addEventAt(title, sMin, eMin) {
  const now = Date.now(), date = todayStr();
  const s = Math.min(sMin, 1439), e = Math.min(Math.max(eMin, s + 30), 1439);
  const it = cleanItem({ kind: 'event', title, cat: 'p', date, time: minToT(s), end: minToT(e), id: uid(), createdAt: now, updatedAt: now });
  if (it) { db.items.push(it); save(); render(true); toast('予定に入れました'); }
}

/* 宣言（タスクの編集シートの中） */
function declBlock(d) {
  if (d.kind !== 'task') return '';
  const all = [...new Set(GROUPS.flatMap((g) => g.members))];
  let h = `<div class="fcard rows"><div class="frow">${IC.eye}<span class="lab" style="white-space:normal">自分締切を宣言する</span><button class="sw" role="switch" aria-checked="${!!d.declOn}" aria-label="自分締切を宣言する" data-action="declOn"><span></span></button></div>`;
  if (d.declOn) {
    h += `<label class="frow">${IC.cal}<span class="lab">自分締切</span><input type="date" data-field="declDue" value="${esc(d.declDue)}"></label>
      <div class="repbox"><span class="mono">見守ってもらう人</span><div class="watch">${all.map((id) => `<button class="chip" data-action="declWho" data-v="${id}" aria-pressed="${d.declWatch.includes(id)}">${esc(PEOPLE[id])}</button>`).join('')}</div>
      <p class="note" style="padding:0">本当の締切より<b>早めの日</b>を宣言すると、選んだ人の画面に締切までの点が出ます。作業を始めると、その人たちに「作業中」が灯ります。</p></div>`;
  }
  return h + '</div>';
}
function applyDecl(id, d) {
  if (!id || d.kind !== 'task') return;
  if (d.declOn && isDate(d.declDue)) {
    const prev = so.decl[id];
    so.decl[id] = { due: d.declDue, watch: d.declWatch.slice(), made: prev ? prev.made : todayStr() };
  } else delete so.decl[id];
  saveSocial();
}

const SA = {
  group(el) { so.group = el.dataset.v; saveSocial(); render(); },
  person(el) { openPerson(el.dataset.id); },
  invite(el) {
    const id = el.dataset.id, s = Number(el.dataset.s);
    closeSheet();
    toast(`${PEOPLE[id]}に「${tLabel(s)}からどう？」を送りました`);
    demoReply(id, 'いいよ、その時間なら！', 2600, () => addEventAt(`${PEOPLE[id]}と`, s, s + 90));
  },
  inviteAll(el) {
    const who = el.dataset.who.split(','), s = Number(el.dataset.s), e = Number(el.dataset.e);
    toast(`${who.map((w) => PEOPLE[w]).join('・')}に「${tLabel(s)}からやらない？」を送りました`);
    demoReply(who[0], '行ける！', 2600, () => addEventAt(`${grp().name}と`, s, e));
  },
  cheer(el) {
    const id = el.dataset.id;
    toast(`${PEOPLE[id]}に「${el.dataset.t}」を送りました`);
    if (st.sheet && st.sheet.person) closeSheet();
  },
  focusStart() {
    const open = live().filter((i) => i.kind === 'task' && !i.done && (so.decl[i.id] || i.date === todayStr())).sort((a, b) => (!!so.decl[b.id] - !!so.decl[a.id]) || taskSort(a, b));
    if (!open.length) { toast('今日のタスクを先に追加してください'); return; }
    const it = open[0];
    so.focus = { taskId: it.id, since: Date.now() }; saveSocial(); render(true);
    const watchers = so.decl[it.id] ? so.decl[it.id].watch : grp().members.slice(0, 2);
    toast(`${watchers.map(nameOf).join('・') || grp().name}に「作業中」が灯りました`);
    if (watchers[0]) setTimeout(() => {
      (so.cheers[it.id] = so.cheers[it.id] || []).push({ by: watchers[0], text: 'がんばれ', at: Date.now() });
      saveSocial(); if (!st.sheet) render(true);
      toast(`${nameOf(watchers[0])}：「がんばれ」`);
    }, 4000);
  },
  focusStop() {
    const f = so.focus; so.focus = null; saveSocial(); render(true);
    const mins = f ? Math.max(1, Math.round((Date.now() - f.since) / 60000)) : 0;
    toast(`${mins}分の作業を記録しました`);
  },
  someAdd() {
    const v = (st.someDraft || '').trim(); if (!v) { const f = $('#someIn'); if (f) f.focus(); return; }
    (so.someday[so.group] = so.someday[so.group] || []).unshift({ id: uid(), title: v.slice(0, 80), by: 'me', at: Date.now() });
    st.someDraft = ''; saveSocial(); render(true); toast('いつかリストに追加しました');
  },
  someSuggest(el) {
    const g = grp(), list = so.someday[g.id] || [], x = list.find((y) => y.id === el.dataset.id); if (!x) return;
    // デモ：次の土曜か日曜の夕方を、全員が空いている日として提案
    let d = addDays(todayStr(), 1); for (let k = 0; k < 7 && ![0, 6].includes(parse(d).getDay()); k++) d = addDays(d, 1);
    const label = `${shortDate(d)}（${DOW_JP[parse(d).getDay()]}）18:00`;
    x.plan = label + ' 提案中'; saveSocial(); render(true);
    toast(`みんなが空いている ${label} を提案しました`);
    const who = g.members[0];
    setTimeout(() => {
      x.plan = label + ' 決定'; saveSocial(); if (!st.sheet) render(true);
      toast(`${PEOPLE[who]}：「その日いける！」`, '予定に入れる', () => {
        const now = Date.now();
        const it = cleanItem({ kind: 'event', title: x.title, cat: 'p', date: d, time: '18:00', end: '20:00', id: uid(), createdAt: now, updatedAt: now });
        if (it) { db.items.push(it); save(); render(true); toast('予定に入れました'); }
      });
    }, 2600);
  },
  declOn() {
    const d = st.sheet.d; d.declOn = !d.declOn;
    if (d.declOn && !isDate(d.declDue)) d.declDue = d.date ? (addDays(d.date, -2) >= todayStr() ? addDays(d.date, -2) : todayStr()) : addDays(todayStr(), 3);
    if (d.declOn && !d.declWatch.length) d.declWatch = grp().members.slice(0, 2);
    renderSheet();
  },
  declWho(el) {
    const d = st.sheet.d, v = el.dataset.v;
    d.declWatch = d.declWatch.includes(v) ? d.declWatch.filter((x) => x !== v) : [...d.declWatch, v];
    renderSheet();
  },
  resetSocial() {
    so = freshSocial(); saveSocial(); render(); toast('なかまのデモをリセットしました');
  }
};
Object.assign(A, SA);

/* ---------- boot ---------- */
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
